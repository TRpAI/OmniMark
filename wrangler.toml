name = "omnimark"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"

# =========================================================================
# 【Cloudflare 控制台图形化部署与 wrangler.toml 绑定配置】
# 当您通过 GitHub 连接 Cloudflare Pages 时，Cloudflare 会自动读取此文件。
# 您也可以在 Cloudflare 控制台 -> 项目 -> 设置 -> 函数 (Functions) 中图形化添加绑定：
# 1. D1 数据库绑定 -> 变量名: DB
# 2. KV 命名空间绑定 -> 变量名: CACHE_KV
# =========================================================================

[[d1_databases]]
binding = "DB"
database_name = "omnimark-d1"
database_id = "82ebf74d-0134-492c-a8cd-a418dfc79a04"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "a37e2404786748aca66083ac1bc32c9c"


