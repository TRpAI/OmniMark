name = "omnimark"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
# 【管理员密码环境变量配置】
# 您可以在 Cloudflare Pages 控制台【设置 (Settings) -> 环境变量 (Variables and Secrets)】中添加：
# 变量名: ADMIN_PASSWORD  (或 OMNIMARK_INITIAL_ADMIN_PASSWORD)
# 值: 您的自定义管理员密码 (建议在控制台勾选 Encrypt 加密保存)
# 
# 如果设置了 ADMIN_PASSWORD，系统首次启动或登录时会直接使用该密码并安全加密入库。

# =========================================================================
# 【Cloudflare 控制台图形化部署与 wrangler.toml 绑定配置】
# 当您通过 GitHub 连接 Cloudflare Pages 时，Cloudflare 会自动读取此文件。
# 您也可以在 Cloudflare 控制台 -> 项目 -> 设置 -> 函数 (Functions) 中图形化添加绑定：
# 1. D1 数据库绑定 -> 变量名: DB
# 2. KV 命名空间绑定 -> 变量名: CACHE_KV
# =========================================================================

[[d1_databases]]
binding = "DB"
database_name = "omnimark-d1"
database_id = "82ebf74d-0134-492c-a8cd-a418dfc79a04"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "a37e2404786748aca66083ac1bc32c9c"


