# Cloudflare Pages 配置文件 (专为 Pages 架构设计)
name = "omnimark-navigation"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"

# =========================================================================
# 【Cloudflare 资源绑定说明】
# D1 数据库 UUID 和 KV 命名空间 ID 无需在此文件中填入，也无需在构建时管理。
# 1. 登录 Cloudflare 控制台 -> Workers 和 Pages -> 选择您的项目
# 2. 点击「设置 (Settings)」->「函数 / 绑定 (Bindings)」
# 3. 添加 D1 数据库绑定（变量名: DB）和 KV 命名空间绑定（变量名: CACHE_KV）
# 4. 您也可以直接在站点管理后台「系统设置与密钥」中输入保存 D1 UUID 与 KV ID
# =========================================================================

