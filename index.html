    <script>
      // Target strictly known Vite HMR dev-server connection failures in sandboxed iframes.
      // Avoid suppressing legitimate application WebSockets or interrupting error propagation.
      const isViteHmrError = (msg) => {
        if (!msg || typeof msg !== 'string') return false;
        const lower = msg.toLowerCase();
        return (
          msg.includes('[vite]') && (lower.includes('websocket') || lower.includes('ws://') || lower.includes('failed to connect'))
        ) || (
          lower.includes('failed to connect to websocket') && (msg.includes('3000') || lower.includes('vite'))
        );
      };

      window.addEventListener('unhandledrejection', (event) => {
        const reason = event && event.reason;
        const msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (isViteHmrError(msg)) {
          event.preventDefault();
        }
      });

      window.addEventListener('error', (event) => {
        const msg = (event && (event.message || (typeof event === 'string' ? event : ''))) || '';
        if (isViteHmrError(msg)) {
          event.preventDefault();
        }
      });
    </script>
